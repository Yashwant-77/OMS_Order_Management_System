name: Dev to Main Pipeline

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ===== Backend (Spring Boot) =====
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test Backend
        working-directory: backend/OMS_backend_springboot
        run: mvn test

      # ===== Frontend (Angular) =====
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: frontend/OMS_frontend_angular
        run: npm install

      - name: Test Frontend
        working-directory: frontend/OMS_frontend_angular
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # ===== Create Pull Request =====
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          branch: dev
          base: main
          title: "Auto Merge: dev → main"
          body: "Automated PR after successful tests"

      # ===== Auto Merge PR =====
      - name: Merge PR
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          merge-method: squash
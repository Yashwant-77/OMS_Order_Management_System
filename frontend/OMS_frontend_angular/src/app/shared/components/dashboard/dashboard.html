<div class="p-6 bg-gray-100 min-h-screen rounded-2xl">

    <!-- HEADER -->
    <h1 class="text-2xl font-semibold text-gray-800">
        Welcome back, {{role}}
    </h1>
    <p class="text-gray-500 mb-6">
        Here's what's happening in your Order Management System today.
    </p>

    <!-- STATS CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">

        <!-- CARD -->
        <div class="bg-white rounded-xl shadow p-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="bg-indigo-100 text-indigo-600 p-3 rounded-lg">
                    <i class="fas fa-box"></i>
                </div>
                <p class="text-sm text-gray-500">TOTAL ORDERS</p>
            </div>

            <h2 class="text-2xl font-bold">1,284</h2>
            <p class="text-green-500 text-sm mt-2">↑ 12% this month</p>
        </div>

        <!-- CARD -->
        <div class="bg-white rounded-xl shadow p-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="bg-green-100 text-green-600 p-3 rounded-lg">
                    <i class="fas fa-user"></i>
                </div>
                <p class="text-sm text-gray-500">TOTAL CUSTOMERS</p>
            </div>

            <h2 class="text-2xl font-bold">342</h2>
            <p class="text-green-500 text-sm mt-2">↑ 8 new this week</p>
        </div>

        <!-- CARD -->
        <div class="bg-white rounded-xl shadow p-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="bg-yellow-100 text-yellow-600 p-3 rounded-lg">
                    <i class="fas fa-file-invoice"></i>
                </div>
                <p class="text-sm text-gray-500">TOTAL BILLS</p>
            </div>

            <h2 class="text-2xl font-bold">₹4.2L</h2>
            <p class="text-green-500 text-sm mt-2">↑ 5% from last month</p>
        </div>

        <!-- CARD -->
        <div class="bg-white rounded-xl shadow p-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="bg-red-100 text-red-600 p-3 rounded-lg">
                    <i class="fas fa-clock"></i>
                </div>
                <p class="text-sm text-gray-500">PENDING ORDERS</p>
            </div>

            <h2 class="text-2xl font-bold">37</h2>
            <p class="text-red-500 text-sm mt-2">↑ 3 since yesterday</p>
        </div>

    </div>


    <div class="flex flex-wrap w-full gap-4 justify-between ">
        <div class="w-full sm:w-[48%] bg-white rounded-xl shadow p-5">

            <h3 class="text-gray-700 font-semibold mb-3">Order Status</h3>

            <div class="h-[300px]">
                <canvas baseChart [data]="pieChartData" [type]="pieChartType">
                </canvas>
            </div>

        </div>
        <div class="w-full sm:w-[48%] bg-white rounded-xl shadow p-5">
            <h3 class="text-gray-700 font-semibold mb-3">Monthly Orders</h3>

            <div class="h-[300px]">
                <canvas baseChart [data]="barChartData" [type]="barChartType">
                </canvas>
            </div>
        </div>
    </div>



</div>

<div class="flex h-screen bg-gray-100 overflow-hidden ">
  <div class="h-full bg-white">
    <!-- SIDENAV -->
    <aside [ngClass]="{
        'w-[220px]!': !isCollapsed,
        'w-[72px]!': isCollapsed,
        'translate-x-0 shadow-xl z-20': mobileOpen,
        '-translate-x-full': !mobileOpen
      }" class="absolute md:relative md:translate-x-0 top-0 bottom-0 left-0
               flex flex-col
             transition-all duration-240 ease-in-out
             overflow-hidden shrink-0 md:w-auto">

      <div class="bg-[#3f51b5] relative h-14 border-r border-gray-400 text-white flex justify-center items-center">

        <h1 class="text-md font-bold py-2">Menu</h1>
        <button (click)="toggleSidenav()"
          class="w-10 h-10 rounded-full flex items-center justify-center md:hidden  hover:bg-white/15 transition-colors cursor-pointer border-none bg-transparent text-white absolute right-0">
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>

      <ul class="flex flex-col gap-0.5 p-2 mt-1 list-none border-r bg-white  h-full border-gray-200 ">
        

        <li routerLink="/dashboard" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-gauge text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm  overflow-hidden transition-all duration-240 " [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Dashboard</span>
        </li>


        <li routerLink="/sales-orders" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-shopping-cart text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm  overflow-hidden transition-all duration-240 " [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Orders</span>
        </li>


        <li routerLink="/bom" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-boxes text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm overflow-hidden transition-all duration-240" [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">BOM</span>
        </li>

        <li routerLink="/purchase-orders" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-truck text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm overflow-hidden transition-all duration-240 " [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Purchase</span>
        </li>

        <li routerLink="/invoice" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-file-invoice text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm overflow-hidden transition-all duration-240" [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Invoice</span>
        </li>

        <li routerLink="/reports" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-chart-bar text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm overflow-hidden transition-all duration-240" [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Reports</span>
        </li>
        <li routerLink="/users" routerLinkActive="bg-[#e8eaf6] text-[#3f51b5] font-medium" 
          class="flex items-center gap-3 h-12 px-3 rounded-lg cursor-pointer text-gray-600 hover:bg-[#e8eaf6] hover:text-[#3f51b5] transition-colors overflow-hidden whitespace-nowrap">
          <i class="fas fa-user text-[18px] shrink-0 w-6 text-center"></i>
          <span class="text-sm overflow-hidden transition-all duration-240" [style.width]="isCollapsed ? '0' : 'auto'"
            [style.opacity]="isCollapsed ? '0' : '1'">Users</span>
        </li>

      </ul>


      <!-- user info tag in sidenav  -->



    </aside>

  </div>

  <div class="flex flex-col flex-1 w-full bg-gray-300 min-w-0">

    <!-- NAVBAR -->
    <nav class="h-14 bg-[#3f51b5] text-white flex items-center justify-between px-2 z-20 shrink-0 min-w-0">

      <!-- LEFT -->
      <div class="flex items-center gap-2">
        <button (click)="toggleSidenav()"
          class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/15 transition-colors cursor-pointer border-none bg-transparent text-white">
          <i class="fas fa-bars text-lg"></i>
        </button>
        <div routerLink="/dashboard" class="flex items-center gap-2 cursor-pointer">
          <i class="fas fa-box-open text-base hidden sm:block"></i>
          <span class="text-base font-semibold">OMS | <strong>ABC Ltd.</strong></span>

        </div>
      </div>

      <!-- RIGHT -->
      <div class="flex items-center">
        <button
          class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/15 transition-colors cursor-pointer border-none bg-transparent text-white">
          <i class="fas fa-bell text-lg"></i>
        </button>
        <button [matMenuTriggerFor]="menu"
          class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/15 transition-colors cursor-pointer border-none bg-transparent text-white">
          <i class="fas fa-user-circle text-lg"></i>
        </button>
        <mat-menu #menu="matMenu" class="bg-gray-200!">
          <mat-list role="list">
            <mat-list-item class role="listitem">
              <button routerLink="/profile" class="flex gap-2 items-center border-2 px-2 py-1 bg-[#3f51b5]  cursor-pointer text-white rounded-lg">
                <i class="fas fa-user-circle "></i>
                <span>Profile</span>

              </button>
            </mat-list-item>
            <mat-list-item class role="listitem">
              <button (click)="logout()" class="flex gap-2 items-center cursor-pointer border-2 px-2 py-1 bg-[#3f51b5] rounded-lg text-white">
                <i class="fas fa-arrow-right-from-bracket"></i>
                <span>Logout</span>

              </button>
            </mat-list-item>

          </mat-list>
        </mat-menu>
      </div>

    </nav>

    <!-- BODY -->
    <div class="flex flex-1 overflow-hidden relative">

      <!-- OVERLAY (mobile only) -->
      <div (click)="closeMobile()" [class.hidden]="!mobileOpen" class="absolute inset-0 bg-black/40 z-10 md:hidden">
      </div>


      <!-- PAGE CONTENT -->
      <main class="flex-1 overflow-y-auto p-4 ">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>

</div>

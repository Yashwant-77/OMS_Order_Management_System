<mat-toolbar color="primary" class="px-4" >
    <span class="text-lg font-semibold">
  OMS | <span class="font-bold">ABC Ltd.</span>
</span>
</mat-toolbar>
<div class="w-full mt-15 flex flex-col  items-center justify-center ">

    <div class="w-[90%] md:w-[60%] shadow-lg hover:shadow-xl p-10 rounded-2xl">
        <h1 class="bg-[#3f51b5] text-white py-5 rounded-2xl w-full text-3xl text-center mb-10">Login Form</h1>


        <mat-form-field class="w-full"  appearance="outline">
            <mat-label >Login as </mat-label>
            <mat-select>
                <mat-option value="">ADMINISTRATOR</mat-option>
                <mat-option value="two">PRODUCT MANAGER</mat-option>
                <mat-option value="">SALES REPRESENTATIVE</mat-option>
                <mat-option value="two">PURCHASING OFFICER</mat-option>
                <mat-option value="">FINANCE MANAGER</mat-option>
                <mat-option value="">BUSINESS ANALYTICS</mat-option>
                <mat-option value="two"></mat-option>
            </mat-select>
        </mat-form-field>


        <mat-form-field class="w-full" appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput placeholder="Placeholder">
        </mat-form-field>


        <mat-form-field class="w-full" appearance="outline">
            <mat-label>Password</mat-label>
            <input type="password" matInput placeholder="Placeholder">
        </mat-form-field>

        <div class="flex gap-3">
            <button   class="w-full h-auto text-lg" matButton="filled" color="primary">Basic</button>
            <button class="w-full " matButton="filled" color="primary">Reset</button>
        </div>

    </div>

</div>

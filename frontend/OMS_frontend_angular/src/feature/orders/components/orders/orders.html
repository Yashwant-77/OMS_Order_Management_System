

<div class="m-3 ">
    <h1 class="text-2xl font-semibold ps-5 mb-5 py-4 bg-white rounded-2xl">Orders Dashboard</h1>
    <div class="p-6 bg-gray-50   rounded-t-2xl ">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-xl font-semibold">Past Orders</h1>
      <p class="text-gray-500 text-sm">Track your orders to boost your sales.</p>
    </div>

    <div class="flex gap-3">
      <button class="border px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-gray-100">
        Export
      </button>

      <button class="bg-[#3f51b5] text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-indigo-600">
         <i class="fas fa-plus text-md"></i>
         Add Product
      </button>
    </div>
  </div>

  <!-- Search + Filter -->
  <div class="flex justify-between items-center mb-4">
    <input 
      type="text" 
      placeholder="Search..."
      class="w-1/3 px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
    />

    <button class="border px-4 py-2 rounded-lg hover:bg-gray-100">
      Filter
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow-sm  h-80 overflow-y-auto">
    <table class="w-full text-left">

      <!-- Table Head -->
      <thead class="bg-gray-100 text-gray-600 text-sm sticky top-0">
        <tr >
          <th class="p-4"><input type="checkbox"></th>
          <th class="p-4">Products</th>
          <th class="p-4">Category</th>
          <th class="p-4">Brand</th>
          <th class="p-4">Price</th>
          <th class="p-4">Stock</th>
          <th class="p-4">Created At</th>
          <th class="p-4">Options</th>
        </tr>
      </thead>

      <!-- Table Body -->
      <tbody>

        <!-- Row -->
        <tr class="border-t hover:bg-gray-50">
          <td class="p-4"><input type="checkbox"></td>

          <td class="p-4 flex items-center gap-3">
            <img src="https://via.placeholder.com/40" class="w-10 h-10 rounded-md">
            <span class="font-medium">ASUS ROG Gaming Laptop</span>
          </td>

          <td class="p-4">Laptop</td>
          <td class="p-4">ASUS</td>
          <td class="p-4">$2,199</td>

          <td class="p-4">
            <span class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-xs">
              Out of Stock
            </span>
          </td>

          <td class="p-4">01 Dec, 2027</td>

          <td class="p-4 text-2xl">
            <button class="cursor-pointer rounded-full py-2 px-5 hover:bg-gray-200">

                ⋮
            </button>
        </td>
        </tr>
        <tr class="border-t hover:bg-gray-50">
          <td class="p-4"><input type="checkbox"></td>

          <td class="p-4 flex items-center gap-3">
            <img src="https://via.placeholder.com/40" class="w-10 h-10 rounded-md">
            <span class="font-medium">ASUS ROG Gaming Laptop</span>
          </td>

          <td class="p-4">Laptop</td>
          <td class="p-4">ASUS</td>
          <td class="p-4">$2,199</td>

          <td class="p-4">
            <span class="bg-red-100 text-red-600 px-2 py-1 rounded-full text-xs">
              Out of Stock
            </span>
          </td>

          <td class="p-4">01 Dec, 2027</td>

          <td class="p-4 text-2xl">
            <button class="cursor-pointer rounded-full py-2 px-5 hover:bg-gray-200">

                ⋮
            </button>
        </td>
        </tr>

      
       

      </tbody>
    </table>
  </div>
</div>

<mat-paginator class="rounded-b-2xl! " [length]="100"
              [pageSize]="10"
              [pageSizeOptions]="[5, 10, 25, 100]"
              aria-label="Select page">
</mat-paginator>
</div>

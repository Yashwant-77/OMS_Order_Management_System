<div class="bg-gray-300 min-h-screen">

    <!-- basic navbar  -->
    <mat-toolbar color="primary" class="px-4">
        <span class="text-lg font-semibold">
            OMS | <span class="font-bold">ABC Ltd.</span>
        </span>
    </mat-toolbar>
    <!-- basic navbar end -->

    <!-- main section of the page -->
    <div class="w-full mt-15 flex flex-col items-center justify-center">

        <div class="w-[90%] md:w-[60%] relative shadow-lg hover:shadow-xl p-10 rounded-2xl bg-white">
            <h1 class="bg-[#3f51b5] text-white py-5 rounded-2xl w-full text-3xl text-center mb-10">Set Your Password</h1>
            
            <div *ngIf="isLoading" class="absolute inset-0 bg-white/70 flex justify-center items-center z-10 rounded-2xl">
                <mat-progress-spinner mode="indeterminate" diameter="50"></mat-progress-spinner>
            </div>

            <div *ngIf="!token" class="text-center text-red-500 py-4 mb-4">
                <p class="text-lg font-semibold">Invalid or missing token.</p>
                <p class="text-sm mt-2 text-gray-500">Please make sure you clicked the full link from your email.</p>
            </div>

            <form *ngIf="token" (ngSubmit)="onSubmit()" #setForm="ngForm">

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>New Password</mat-label>
                    <input type="password" matInput placeholder="Enter new password (min 6 chars)" name="password" [(ngModel)]="password" required>
                </mat-form-field>

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>Confirm Password</mat-label>
                    <input type="password" matInput placeholder="Confirm new password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
                </mat-form-field>

                <div class="flex gap-3 mt-4">
                    <button [disabled]="setForm.invalid || isLoading" type="submit" class="w-full h-auto text-lg" matButton="filled" color="primary">Set Password</button>
                </div>

                <div class="mt-4 text-center">
                    <a routerLink="/login" class="text-[#3f51b5] hover:underline cursor-pointer font-medium">Back to Login</a>
                </div>

            </form>

        </div>

    </div>
</div>

<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center mb-6">
      <!-- You can put logo here -->
      <div class="h-12 w-12 bg-[#3f51b5] rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">
        OMS
      </div>
    </div>
    <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
      Set Your Password
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Please enter a new password for your account.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-4 shadow-xl shadow-indigo-100/50 sm:rounded-2xl sm:px-10 border border-gray-100">
      
      <div *ngIf="!token" class="text-center text-red-500 py-4">
        <i class="fas fa-exclamation-circle text-4xl mb-3"></i>
        <p>Invalid or missing token.</p>
        <p class="text-sm mt-2 text-gray-500">Please make sure you clicked the full link from your email.</p>
      </div>

      <form *ngIf="token" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
          <div class="mt-1">
            <input 
              id="password" 
              name="password" 
              type="password" 
              [(ngModel)]="password"
              required
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3f51b5] focus:border-transparent transition-all"
              placeholder="Enter new password (min 6 chars)"
            >
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <div class="mt-1">
            <input 
              id="confirmPassword" 
              name="confirmPassword" 
              type="password" 
              [(ngModel)]="confirmPassword"
              required
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3f51b5] focus:border-transparent transition-all"
              placeholder="Confirm new password"
            >
          </div>
        </div>

        <div>
          <button 
            type="submit" 
            [disabled]="isLoading || !password || !confirmPassword"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-[#3f51b5] hover:bg-[#303f9f] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#3f51b5] disabled:bg-[#7986cb] disabled:cursor-not-allowed transition-all"
          >
            <i *ngIf="isLoading" class="fas fa-circle-notch fa-spin mr-2 mt-1"></i>
            {{ isLoading ? 'Setting Password...' : 'Set Password' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

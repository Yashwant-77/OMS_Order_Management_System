<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
  <!-- Dynamic Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-300 mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-300 mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-[-20%] left-[20%] w-[40%] h-[40%] rounded-full bg-pink-300 mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    <div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/20 p-8 sm:p-10 transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 text-indigo-600 mb-6 shadow-sm border border-indigo-100">
          <i class="fas" [ngClass]="{'fa-envelope-open-text': step === 1, 'fa-key': step === 2}"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight">
          {{ step === 1 ? 'Forgot Password?' : 'Reset Password' }}
        </h2>
        <p class="text-sm text-gray-500 mt-2 font-medium">
          {{ step === 1 ? 'Enter your details to receive an OTP' : 'Enter the OTP sent to ' + email }}
        </p>
      </div>

      <!-- Step 1 Form: Request OTP -->
      <form *ngIf="step === 1" (ngSubmit)="requestOtp()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-envelope"></i>
            </div>
            <input type="email" [(ngModel)]="email" name="email" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200"
              placeholder="admin@oms.com">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Role</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-user-tag"></i>
            </div>
            <select [(ngModel)]="role" name="role" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 appearance-none">
              <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
            </select>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full relative group overflow-hidden rounded-xl bg-indigo-600 px-4 py-3 text-sm font-medium text-white shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed">
          <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
          <div class="flex items-center justify-center gap-2 relative z-10">
            <i class="fas fa-paper-plane" *ngIf="!isLoading"></i>
            <i class="fas fa-circle-notch fa-spin" *ngIf="isLoading"></i>
            <span>{{ isLoading ? 'Sending...' : 'Send OTP' }}</span>
          </div>
        </button>
      </form>

      <!-- Step 2 Form: Verify OTP and Reset -->
      <form *ngIf="step === 2" (ngSubmit)="resetPassword()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">6-Digit OTP</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-hashtag"></i>
            </div>
            <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6"
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm font-mono tracking-widest focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200 text-center text-lg"
              placeholder="------">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-lock"></i>
            </div>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200"
              placeholder="••••••••">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fas fa-lock"></i>
            </div>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all duration-200"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full relative group overflow-hidden rounded-xl bg-green-600 px-4 py-3 text-sm font-medium text-white shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500/50 transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed">
          <span class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
          <div class="flex items-center justify-center gap-2 relative z-10">
            <i class="fas fa-check-circle" *ngIf="!isLoading"></i>
            <i class="fas fa-circle-notch fa-spin" *ngIf="isLoading"></i>
            <span>{{ isLoading ? 'Resetting...' : 'Reset Password' }}</span>
          </div>
        </button>

        <div class="text-center">
          <button type="button" (click)="step = 1" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition-colors">
            Try a different email?
          </button>
        </div>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-center gap-2">
        <span class="text-sm text-gray-500">Remember your password?</span>
        <a routerLink="/login" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">Sign in here</a>
      </div>

    </div>
  </div>
</div>

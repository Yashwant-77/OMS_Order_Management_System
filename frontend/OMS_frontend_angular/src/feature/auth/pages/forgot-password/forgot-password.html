<div class="bg-gray-300 min-h-screen">

    <!-- basic navbar  -->
    <mat-toolbar color="primary" class="px-4">
        <span class="text-lg font-semibold">
            OMS | <span class="font-bold">ABC Ltd.</span>
        </span>
    </mat-toolbar>
    <!-- basic navbar end -->

    <!-- main section of the page -->
    <div class="w-full mt-15 flex flex-col items-center justify-center">

        <div class="w-[90%] md:w-[60%] relative shadow-lg hover:shadow-xl p-10 rounded-2xl bg-white">
            <h1 class="bg-[#3f51b5] text-white py-5 rounded-2xl w-full text-3xl text-center mb-10">
                {{ step === 1 ? 'Forgot Password?' : 'Reset Password' }}
            </h1>

            <div *ngIf="isLoading"
                class="absolute inset-0 bg-white/70 flex justify-center items-center z-10 rounded-2xl">
                <mat-progress-spinner mode="indeterminate" diameter="50"></mat-progress-spinner>
            </div>

            <!-- Step 1 Form: Request OTP -->
            <form *ngIf="step === 1" (ngSubmit)="requestOtp()" #otpForm="ngForm">

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>Role</mat-label>
                    <mat-select name="role" [(ngModel)]="role" required>
                        <mat-option *ngFor="let r of roles" [value]="r">{{ r.split("_").join(" ") }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>Email Address</mat-label>
                    <input matInput placeholder="admin@oms.com" name="email" [(ngModel)]="email" required type="email">
                </mat-form-field>

                <div class="flex gap-3 mt-4">
                    <button [disabled]="otpForm.invalid || isLoading" type="submit" class="w-full h-auto text-lg"
                        matButton="filled" color="primary">Send OTP</button>
                </div>

                <div class="mt-4 text-center">
                    <a routerLink="/login" class="text-[#3f51b5] hover:underline cursor-pointer font-medium">Remembered
                        your password? Login</a>
                </div>

            </form>

            <!-- Step 2 Form: Verify OTP and Reset -->
            <form *ngIf="step === 2" (ngSubmit)="resetPassword()" #resetForm="ngForm">

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>6-Digit OTP</mat-label>
                    <input matInput placeholder="------" name="otp" [(ngModel)]="otp" required maxlength="6">
                </mat-form-field>

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>New Password</mat-label>
                    <input type="password" matInput placeholder="New Password" name="newPassword"
                        [(ngModel)]="newPassword" required>
                </mat-form-field>

                <mat-form-field class="w-full" appearance="outline">
                    <mat-label>Confirm Password</mat-label>
                    <input type="password" matInput placeholder="Confirm Password" name="confirmPassword"
                        [(ngModel)]="confirmPassword" required>
                </mat-form-field>

                <div class="flex gap-3 mt-4">
                    <button [disabled]="resetForm.invalid || isLoading" type="submit" class="w-full h-auto text-lg"
                        matButton="filled" color="primary">Reset Password</button>
                </div>

                <div class="mt-4 text-center">
                    <button type="button" (click)="step = 1"
                        class="text-[#3f51b5] hover:underline cursor-pointer font-medium bg-transparent border-none">Try
                        a different email?</button>
                </div>

            </form>

        </div>

    </div>
</div>
